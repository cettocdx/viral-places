packages:
  - "apps/*"
  - "packages/*"

# Expo + pnpm: hoisted layout is the Expo-recommended monorepo mode (Metro/native tooling).
nodeLinker: hoisted
shamefullyHoist: true
strictPeerDependencies: false

# Added automatically by `npx expo install` (loose mode); kept so SDK-matched versions resolve.
minimumReleaseAgeExclude:
  - '@expo/ui@57.0.18'
  - expo-constants@57.0.18
  - expo-crypto@57.0.3
  - expo-glass-effect@57.0.3
  - expo-haptics@57.0.3
  - expo-image@57.0.5
  - expo-linking@57.0.10
  - expo-location@57.0.17
  - expo-router@57.0.21
  - expo-sqlite@57.0.3
  - expo-symbols@57.0.3
  - expo-system-ui@57.0.4
  - expo-web-browser@57.0.3
  - '@expo/cli@57.0.24'
  - '@expo/fingerprint@0.20.13'
  - '@expo/prebuild-config@57.0.16'
  - expo-asset@57.0.17
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-keep-awake@57.0.2
  - expo-modules-autolinking@57.0.13
  - expo-modules-core@57.0.18
  - expo@57.0.22
  - '@next/env@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - next@16.3.5

# esbuild (tsx bağımlılığı) postinstall yalnız ikiliyi doğrular; onaylı build listesi (pnpm 11 allowBuilds)
allowBuilds:
  esbuild: true
